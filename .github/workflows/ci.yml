name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  postgres-sandbox:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jacaranda_synthetic
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner -d jacaranda_synthetic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: sqlite://
      SECRET_KEY: synthetic-uber-ci-key-not-a-real-operational-secret-20261021
      JACARANDA_TEST_POSTGRES_URL: postgresql://test_runner:synthetic-ci-only-password@127.0.0.1:5432/jacaranda_synthetic
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Match PostgreSQL client to the rehearsal server
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify PostgreSQL concurrency and recovery
        run: |
          pg_dump --version
          psql --version
          python -m pytest tests/test_uber_postgres.py tests/test_uber_pos_postgres.py -q --tb=short

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependency auditor
        run: python -m pip install pip-audit==2.10.1

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --strict --progress-spinner off

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.8.4

      - name: Ruff check
        run: ruff check app/ main.py scripts/ci_test_shards.py tests/test_ci_sharding.py --output-format=github

  test-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        env:
          COVERAGE_FILE: ci-reports/shard-${{ matrix.shard }}/.coverage.${{ matrix.shard }}
        run: >-
          python -m pytest tests/ -q --tb=short --cov=app --cov-report=
          -p scripts.ci_test_shards --ci-shard=${{ matrix.shard }}/4
          --ci-shard-report=ci-reports/shard-${{ matrix.shard }}/collection.json
          --junitxml=ci-reports/shard-${{ matrix.shard }}/junit.xml

      - name: Upload shard evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-shard-${{ matrix.shard }}
          path: ci-reports/shard-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Preserve the existing test check name. It can pass only when all shards
  # pass, their collections match, and the merged coverage can be generated.
  test:
    if: always()
    needs: [test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARD_RESULT" = success

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install coverage reporter
        run: python -m pip install coverage

      - name: Download shard evidence
        uses: actions/download-artifact@v7
        with:
          pattern: test-shard-*
          path: ci-reports

      - name: Verify complete collection and combine coverage
        run: |
          python scripts/ci_test_shards.py --total 4 ci-reports/test-shard-*/collection.json
          for shard in 1 2 3 4; do
            test -s "ci-reports/test-shard-$shard/.coverage.$shard"
          done
          python -m coverage combine ci-reports/test-shard-*
          python -m coverage report
          python -m coverage xml

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: jacaranda:ci
          cache-from: type=gha,scope=jacaranda-ci
          cache-to: type=gha,scope=jacaranda-ci,mode=max,ignore-error=true

      - name: Smoke test container
        run: |
          SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')
          docker run -d --name jac -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./jacaranda.db \
            -e SECRET_KEY="$SECRET" \
            -e ADMIN_PASSWORD=ci-admin-password-1234 \
            jacaranda:ci
          # Wait up to 90s (30 attempts x 3s) for Alembic migrations + startup
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health 2>/dev/null; then
              echo ""
              echo "healthy after ${i} attempts"
              docker logs jac | tail -20
              exit 0
            fi
            sleep 3
          done
          echo "=== container did not become healthy ==="
          docker ps -a
          echo "=== container logs ==="
          docker logs jac
          exit 1
