<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Jacaranda Sandbox</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/sandbox.css">
  <script src="/sandbox.js" defer></script>
</head>
<body>
  <header>
    <div class="brand"><img src="/favicon.svg" width="36" height="36" alt=""><strong>Jacaranda</strong><span class="badge">Sandbox</span></div>
    <button id="logout" type="button" hidden>Salir</button>
  </header>
  <main>
    <div class="heading"><h1>Pedidos de prueba</h1><span class="safe">Tienda real sin activar</span></div>
    <form id="access-form">
      <label for="access-key">Clave privada de Sandbox</label>
      <div class="access-row"><input id="access-key" type="password" autocomplete="off" required maxlength="256"><button type="submit">Entrar</button></div>
    </form>
    <p id="status" role="status" aria-live="polite">Acceso privado</p>
    <section id="workspace" hidden>
      <div class="toolbar">
        <h2>Notificaciones</h2>
        <div class="tools"><button id="connection" type="button">Verificar conexi&oacute;n</button><button id="refresh" type="button" aria-label="Actualizar notificaciones" title="Actualizar notificaciones">&#x21bb;</button></div>
      </div>
      <div class="orders-layout">
        <section class="inbox" aria-label="Notificaciones de Uber">
          <div id="events"></div>
          <button id="older" type="button" disabled>Anteriores</button>
        </section>
        <section class="order" aria-label="Pedido seleccionado">
          <div id="empty">Selecciona un pedido</div>
          <div id="order-detail" hidden>
            <div class="order-heading"><h2 id="order-title"></h2><span class="badge" id="order-state"></span></div>
            <div class="order-tools"><button id="reload-order" type="button">Actualizar pedido</button></div>
            <div id="items"></div>
            <h3>Instrucciones</h3><p id="instructions"></p>
            <details open><summary>Detalle recibido</summary><pre id="raw-detail"></pre></details>
            <label class="review"><input id="reviewed" type="checkbox">Productos, modificadores e instrucciones revisados</label>
            <label for="reason">Motivo de rechazo o cancelaci&oacute;n</label>
            <select id="reason"><option value="TECHNICAL_FAILURE">Prueba de integraci&oacute;n</option><option value="ITEM_ISSUE">Producto no disponible</option><option value="SPECIAL_INSTRUCTIONS">Instrucciones especiales</option><option value="STORE_CLOSED">Tienda cerrada</option><option value="POS_NOT_READY">Punto de venta no disponible</option></select>
            <div class="actions"><button id="accept" type="button" disabled>Aceptar prueba</button><button id="deny" type="button" class="danger" disabled>Rechazar prueba</button><button id="cancel" type="button" class="danger" disabled>Cancelar prueba</button></div>
          </div>
        </section>
      </div>
    </section>
    <dialog id="confirm-dialog">
      <form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-order"></p><div class="actions"><button value="cancel" type="submit" class="secondary">Volver</button><button id="confirm-submit" value="confirm" type="submit">Confirmar</button></div></form>
    </dialog>
  </main>
</body>
</html>
